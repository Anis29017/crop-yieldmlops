name: Fetch source data

# DataOps: keep the training data up to date, with a person approving every change.
# - Monthly, and on demand from the Actions tab ("Run workflow").
# - First run: tick "init" to record every book listed today as known (no downloads).
# Each run:
#   1. checks the official pages for new yield books and downloads them (src/dataops/fetch.py);
#   2. reads each book into an Excel file with all its checks (src/dataops/read_books.py); a book
#      that passes every check also gets its rows as data/sources/new_yields/<book>.csv;
#   3. adds the newest finished crop seasons to data/interim/climate_features.csv
#      (NASA POWER + CHIRPS, src/update_climate.py);
#   4. rebuilds the training table (data/processed.csv) and, if it changed, records the new
#      data version in data/DATA_VERSIONS.csv (src/data_version.py);
#   5. opens ONE pull request with whatever changed, its text listing every check.
# Nothing reaches the model until a person reviews and merges that pull request; merging
# then rebuilds the service (Render), which retrains the model on the new data.
on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      init:
        description: "First run: record all currently listed books as known, download nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SOURCES_DOWNLOAD_DIR: /tmp/crop-yield-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (tesseract is the OCR program for the scanned Sindh book)
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt
      - name: Check the source pages and download new books
        run: |
          if [ "${{ inputs.init }}" = "true" ]; then
            python -m src.dataops.fetch --init
          else
            python -m src.dataops.fetch
          fi
      - name: Read the new books (Excel per book; rows of books that pass every check -> data/sources/new_yields)
        if: ${{ !inputs.init }}
        run: python -m src.dataops.read_books "$SOURCES_DOWNLOAD_DIR" --accept data/sources/new_yields
      - name: Add the newest finished seasons to the climate table
        if: ${{ !inputs.init }}
        run: python -m src.update_climate --report "$SOURCES_DOWNLOAD_DIR/report.md"
      - name: Rebuild the training table and record the data version if it changed
        if: ${{ !inputs.init }}
        run: |
          python -m src.build_yield_labels
          python -m src.build_master
          python -m src.prepare_data
          python -m src.data_version --record "DataOps run ${{ github.run_number }}" --report "$SOURCES_DOWNLOAD_DIR/report.md"
      - name: Upload downloaded books and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-books-${{ github.run_number }}
          path: ${{ env.SOURCES_DOWNLOAD_DIR }}
          if-no-files-found: ignore
          retention-days: 90
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            data/sources/manifest.csv
            data/sources/new_yields/*.csv
            data/interim/climate_features.csv
            data/processed.csv
            data/DATA_VERSIONS.csv
          branch: dataops/source-update
          delete-branch: true
          title: "DataOps: new data (run ${{ github.run_number }})"
          commit-message: "DataOps: new books, yield rows and climate seasons (run ${{ github.run_number }})"
          body-path: ${{ env.SOURCES_DOWNLOAD_DIR }}/report.md
